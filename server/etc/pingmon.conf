# PingMon configuration file  (default location: /etc/pingmon.conf)
#
# Format: KEY=VALUE, one per line. '#' starts a comment. Blank lines are ignored.
# Surrounding quotes on a value are stripped.
#
# Precedence:  command-line flag  >  this file  >  built-in default.
# Validate this file with:   pingmon config test
# Install/refresh it with:    sudo pingmon config set
#
# Durations use Go syntax: 500ms, 30s, 5m, 1h, 720h.
# Booleans accept: true/false, 1/0, yes/no, on/off.

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
# host=127.0.0.1            # interface to bind (use 0.0.0.0 for all interfaces)
# port=6868                 # HTTP port

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
# datafolder=/var/lib/pingmon   # absolute directory for persistent data (created
#                                if missing). The database is always
#                                <datafolder>/pingmon.db.
# raw_retain=720h           # keep raw ping results this long (0 = keep forever)
# rollup_interval=5m        # background hourly/daily rollup cadence

# ---------------------------------------------------------------------------
# Monitoring
# ---------------------------------------------------------------------------
# minimum_ping_interval=500ms   # enforced floor for per-host ping interval

# ---------------------------------------------------------------------------
# ARP discovery
# ---------------------------------------------------------------------------
# arpscan=false             # enable periodic ARP scanning (exposes GET /api/arp)
# arp_interval=2m           # passive ARP-cache read cadence
# arp_active=true           # also actively ARP-sweep each subnet (arp-scan -l style;
#                             Linux+root, falls back to passive on macOS/non-root)
# arp_active_interval=10m   # how often the (heavier) active sweep runs
# arp_active_max_hosts=256  # skip active sweep of subnets larger than this (~/24)

# ---------------------------------------------------------------------------
# Modes
# ---------------------------------------------------------------------------
# readonly=false            # block all writes (HTTP 423); freeze / demo mode
# debug=false               # verbose logging

# ---------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------
# name=                     # instance name (defaults to the OS hostname)

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
# Tokens authorize the API via `Authorization: Bearer <token>`. Each must be a
# lowercase uuid4. Comma-separate or repeat the key for several. With none set,
# the API is open. Generate one with:  pingmon token
# token=
